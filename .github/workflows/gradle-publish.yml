name: Build, Test & Upload Library

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        spring-boot: ['3.5.7', '4.0.1']
        java: ['17']
      fail-fast: false

    services:
      postgres:
        image: postgres:12
        env:
          POSTGRES_DB: idempotence4j_db
          POSTGRES_USER: username
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_DATABASE: idempotence4j_db
          MYSQL_ROOT_PASSWORD: admin
          MYSQL_USER: username
          MYSQL_PASSWORD: password
        ports:
          - 3306:3306

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java }}
        distribution: temurin
        server-id: github
        settings-path: ${{ github.workspace }}

    - name: Build with Gradle
      run: ./gradlew build -PspringBootVersion=${{ matrix.spring-boot }}

  build:
    needs: test-matrix
    runs-on: ubuntu-latest
    steps:
      - run: echo "All matrix builds passed"

  publish:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: temurin
        server-id: github
        settings-path: ${{ github.workspace }}

    - name: Publish to GitHub Packages
      run: ./gradlew publish
      env:
        MAVEN_URL: https://maven.pkg.github.com/transferwise/idempotence4j
        MAVEN_USER: ${{ github.actor }}
        MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
