wrapper {
	gradleVersion = '9.8.2'
}

buildscript {
	repositories {
		mavenCentral()
		maven { url = "https://jitpack.io" }
		maven { url = 'https://plugins.gradle.org/m2/' }
		mavenLocal()
	}
	dependencies {
		classpath "com.avast.gradle:gradle-docker-compose-plugin:0.17.21"
        classpath "io.spring.gradle:dependency-management-plugin:1.1.7"
        classpath "org.springframework.boot:spring-boot-gradle-plugin:3.5.7"
	}
}

allprojects {
	version = project.version

	apply plugin: 'java'
	apply plugin: 'java-library'
	apply plugin: 'groovy'
	apply plugin: 'maven-publish'
	apply plugin: 'io.spring.dependency-management'
	apply from: "${rootDir}/libraries.gradle"
	apply from: "${rootDir}/publish.gradle"

	java {
		sourceCompatibility = JavaVersion.VERSION_17
		targetCompatibility = JavaVersion.VERSION_17
	}
	// keep Java 17 bytecode and API when compiling on a newer JDK
	tasks.withType(JavaCompile).configureEach {
		options.release = 17
	}
	repositories {
		mavenCentral()
		mavenLocal()
	}

	dependencyManagement {
		imports {
			mavenBom(libraries.spring_boot)
		}
	}

	testing {
		suites {
			configureEach {
				useSpock(spockVersion)
			}
			integrationTest(JvmTestSuite) {
				sources {
					java.srcDirs = ['src/test-integration/java']
					groovy.srcDirs = ['src/test-integration/groovy']
					resources.srcDirs = ['src/test-integration/resources']
				}
				dependencies {
					implementation project()
				}
			}
		}
	}

	// integration tests share the unit test dependencies
	configurations {
		integrationTestImplementation.extendsFrom testImplementation
		integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
		integrationTestCompileOnly.extendsFrom testCompileOnly
		integrationTestAnnotationProcessor.extendsFrom testAnnotationProcessor
	}

	dependencies {
        annotationProcessor libraries.lombok
        compileOnly libraries.lombok
        compileOnly libraries.groovy

        implementation libraries.slf4j

        testImplementation libraries.groovy
        testImplementation libraries.junit
        testImplementation libraries.spock
        testRuntimeOnly libraries.junit_platform_launcher
        integrationTestRuntimeOnly libraries.junit_platform_launcher
	}

	test {
		reports.junitXml.outputLocation = file('build/test-results')

		testLogging {
			events "passed", "skipped", "failed", "standardError"
			showStackTraces = true
			exceptionFormat = 'full'
		}
	}

	integrationTest {
		reports.junitXml.outputLocation = file('build/test-integration-results')
		shouldRunAfter test

		testLogging {
			events "passed", "skipped", "failed", "standardError"
			showStackTraces = true
			exceptionFormat = 'full'
		}
	}
	check.dependsOn integrationTest

	ext.isRunningOnCI = {
		System.getenv("CI") == "true"
	}

	plugins.withId('docker-compose') {
		def resolveExecutable = { String name ->
			['/opt/homebrew/bin', '/usr/local/bin'].collect { "${it}/${name}" }.find { new File(it).exists() } ?: name
		}
		dockerCompose {
			executable = resolveExecutable('docker-compose')
			dockerExecutable = resolveExecutable('docker')
		}
	}
}

configurations {
	provided
	tests
	runtime {
		exclude module: 'lombok'
	}

	compile {
		exclude module: 'groovy-all'
	}
}
