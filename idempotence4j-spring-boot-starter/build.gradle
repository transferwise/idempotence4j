apply plugin: 'docker-compose'

dependencies {
    api project(':idempotence4j-core')
    implementation project(':idempotence4j-postgres')
    implementation project(':idempotence4j-mariadb')
    implementation project(':idempotence4j-metrics')

    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    implementation libraries.spring_jdbc
    implementation libraries.jackson_datatype
    // Spring Boot 4 moved @DependsOnDatabaseInitialization to spring-boot-sql, which Boot's database initializers bring at runtime
    if (springVersion.startsWith('4.')) {
        compileOnly 'org.springframework.boot:spring-boot-sql'
    }

    integrationTestImplementation 'org.springframework.boot:spring-boot-starter-test'
    integrationTestImplementation 'org.springframework.boot:spring-boot-starter-web'
    integrationTestImplementation 'org.springframework.boot:spring-boot-starter-jdbc'
    integrationTestImplementation project(':idempotence4j-core')
    integrationTestImplementation project(':idempotence4j-postgres')
    integrationTestImplementation project(':idempotence4j-metrics')
    integrationTestImplementation libraries.hikari
    integrationTestImplementation libraries.postgresql
    integrationTestImplementation libraries.mariadb
    integrationTestImplementation libraries.flyway
    integrationTestImplementation libraries.flyway_postgres
    integrationTestImplementation libraries.flyway_mysql
    integrationTestImplementation libraries.spock_spring
    // Spring Boot 4 moved the Flyway auto-configuration out of spring-boot-autoconfigure
    if (springVersion.startsWith('4.')) {
        integrationTestImplementation 'org.springframework.boot:spring-boot-flyway'
    }
}

dockerCompose {
    useComposeFiles = ["${rootDir}/gradle/docker-compose/docker-compose.yml"]
    startedServices = ['postgres', 'mariadb']
    stopContainers = true
    removeContainers = true
}
if(!isRunningOnCI()) {
    dockerCompose.isRequiredBy(integrationTest)
}
